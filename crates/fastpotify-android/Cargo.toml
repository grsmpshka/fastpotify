[package]
name = "fastpotify-android"
version = "0.6.0-android.3"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Thin Android JNI bridge for Fastpotify"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
fastpotify-core = { path = "../fastpotify-core" }
jni = "0.21"
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
